<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8fff" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a7a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="620" fill="#1a1a2e" />

  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#e8e8f5">Per-spec cycle — repeats for every feature</text>

  <rect x="320" y="50" width="240" height="26" rx="13" fill="#2d2d55" stroke="#7c8fff" stroke-width="1.2" />
  <text x="440" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#c7ccff">1 spec = 1 branch = 1 PR</text>

  <!-- Step 1: /spec -->
  <rect x="60" y="95" width="760" height="70" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
  <text x="80" y="122" font-size="15" font-weight="600" fill="#e8e8f5">/spec</text>
  <rect x="140" y="109" width="150" height="18" rx="9" fill="#2d2d55" stroke="#7c8fff" stroke-width="1" />
  <text x="215" y="122" text-anchor="middle" font-size="10" font-weight="600" fill="#c7ccff">includes design pass</text>
  <text x="80" y="146" font-size="11.5" fill="#a0a0c0">
    <tspan x="80" dy="0">For UI specs: derived-vs-new-screen call folded straight into the spec's UI/UX section.</tspan>
    <tspan x="80" dy="16">Writes .context/feature-specs/NNN-slug.md</tspan>
  </text>

  <line x1="440" y1="165" x2="440" y2="191" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- /implement container: a real box, not a dashed side note -->
  <rect x="60" y="195" width="760" height="250" rx="12" fill="#20203a" stroke="#7c8fff" stroke-width="2" />
  <text x="80" y="224" font-size="17" font-weight="700" fill="#e8e8f5">/implement</text>
  <text x="80" y="242" font-size="11" fill="#a0a0c0">Self-correcting loop, up to 5 iterations - marks the spec done when everything checks out</text>

  <!-- Row 1: dev, review-spec-implementation -->
  <g>
    <rect x="80" y="254" width="350" height="70" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="100" y="278" font-size="13" font-weight="600" fill="#e8e8f5">/dev</text>
    <text x="100" y="296" font-size="10" fill="#a0a0c0">Creates feature/NNN-slug, delegates to a</text>
    <text x="100" y="310" font-size="10" fill="#a0a0c0">subagent, writes a verification record</text>
  </g>

  <line x1="430" y1="289" x2="440" y2="289" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="450" y="254" width="350" height="70" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="470" y="278" font-size="13" font-weight="600" fill="#e8e8f5">/review-spec-implementation</text>
    <text x="470" y="296" font-size="10" fill="#a0a0c0">Checks the verification record, verifies every</text>
    <text x="470" y="310" font-size="10" fill="#a0a0c0">criterion, runs a neutralization check</text>
  </g>

  <path d="M 625 324 L 625 336 L 255 336 L 255 348" fill="none" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- Row 2: review-changes, review-security -->
  <g>
    <rect x="80" y="352" width="350" height="70" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="100" y="376" font-size="13" font-weight="600" fill="#e8e8f5">/review-changes</text>
    <text x="100" y="394" font-size="10" fill="#a0a0c0">Convention sweep over the local diff</text>
  </g>

  <line x1="430" y1="387" x2="440" y2="387" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="450" y="352" width="350" height="70" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="470" y="376" font-size="13" font-weight="600" fill="#e8e8f5">/review-security</text>
    <text x="470" y="394" font-size="10" fill="#a0a0c0">Security sweep over the local diff</text>
  </g>

  <!-- Hand-off: /implement marks the spec done, then a manual step -->
  <line x1="440" y1="445" x2="440" y2="471" stroke="#5a5a7a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-dim)" />
  <text x="440" y="461" text-anchor="middle" font-size="9.5" fill="#7c8fff">manual hand-off - /implement never commits or pushes</text>

  <!-- Step 5: /commit-and-push -->
  <rect x="60" y="475" width="760" height="45" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
  <text x="80" y="503" font-size="14" font-weight="600" fill="#e8e8f5">/commit-and-push</text>
  <text x="300" y="503" font-size="11" fill="#a0a0c0">Pushes the branch, opens a PR, or squash-merges - per Merge mode in project-settings.md</text>
</svg>
