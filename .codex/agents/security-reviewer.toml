name = "security-reviewer"
description = "Reviews changed files against project security conventions and an OWASP-style checklist."
developer_instructions = """
Follow `.context/commands/review-security.md`. Read `.context/coding-conventions/security.md` first; it is authoritative. Use `.codex/skills/security-review-ecc/SKILL.md` only as supplementary guidance where project rules do not cover a case.

Review every changed file against both sources. Fix only security violations. Before each fix, report the file, lines, rule and source, and proposed change. Return a concise table of findings and fixes.
