<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8fff" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a7a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="600" fill="#1a1a2e" />

  <text x="440" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#e8e8f5">Agentic Starter Pipeline</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#a0a0c0">Framing runs once per project; the per-spec cycle repeats for every feature</text>

  <!-- Framing section -->
  <text x="20" y="90" font-size="14.5" font-weight="700" fill="#7c8fff">Framing (once)</text>

  <g>
    <rect x="20" y="100" width="190" height="70" rx="10" fill="#232342" stroke="#5a5a7a" stroke-width="1.5" stroke-dasharray="5,4" />
    <text x="115" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#c7ccff">/init-project</text>
    <text x="115" y="145" text-anchor="middle" font-size="9.5" fill="#a0a0c0">only if not yet</text>
    <text x="115" y="157" text-anchor="middle" font-size="9.5" fill="#a0a0c0">initialized</text>
  </g>

  <line x1="210" y1="135" x2="226" y2="135" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <g>
    <rect x="230" y="100" width="190" height="70" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
    <text x="325" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/prd</text>
    <text x="325" y="147" text-anchor="middle" font-size="10.5" fill="#a0a0c0">writes prd.md</text>
  </g>

  <line x1="420" y1="135" x2="436" y2="135" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <g>
    <rect x="440" y="100" width="190" height="70" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
    <text x="535" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/architect</text>
    <text x="535" y="147" text-anchor="middle" font-size="10.5" fill="#a0a0c0">reconciles architecture.md</text>
  </g>

  <line x1="630" y1="135" x2="646" y2="135" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <g>
    <rect x="650" y="100" width="210" height="70" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
    <text x="755" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/design-system</text>
    <text x="755" y="147" text-anchor="middle" font-size="10.5" fill="#a0a0c0">locks ui-context.md tokens</text>
  </g>

  <!-- Down arrow into per-spec cycle -->
  <line x1="440" y1="176" x2="440" y2="212" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Per-spec cycle section -->
  <text x="70" y="232" font-size="14.5" font-weight="700" fill="#7c8fff">Per-spec cycle (repeats for every feature)</text>

  <!-- /spec -->
  <rect x="70" y="242" width="740" height="52" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
  <text x="90" y="264" font-size="13" font-weight="600" fill="#e8e8f5">/spec</text>
  <text x="90" y="282" font-size="10.5" fill="#a0a0c0">Clarifies requirements (includes a design pass for UI specs), writes feature-specs/NNN-slug.md</text>

  <line x1="440" y1="294" x2="440" y2="320" stroke="#7c8fff" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- /implement container: a real box, not just a dashed label -->
  <rect x="70" y="324" width="740" height="176" rx="12" fill="#20203a" stroke="#7c8fff" stroke-width="2" />
  <text x="90" y="350" font-size="13" font-weight="700" fill="#e8e8f5">/implement</text>
  <text x="90" y="369" font-size="10.5" fill="#a0a0c0">self-correcting loop, up to 5 iterations, then marks the spec done</text>

  <g>
    <rect x="90" y="380" width="166" height="55" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="173" y="403" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/dev</text>
    <text x="173" y="419" text-anchor="middle" font-size="9" fill="#a0a0c0">worktree + verif record</text>
  </g>

  <line x1="256" y1="407" x2="266" y2="407" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="270" y="380" width="166" height="55" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="353" y="399" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/review-spec-</text>
    <text x="353" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">implementation</text>
  </g>

  <path d="M 353 435 L 353 448 L 173 448 L 173 461" fill="none" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="90" y="465" width="166" height="30" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="173" y="484" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/review-changes</text>
  </g>

  <line x1="256" y1="480" x2="266" y2="480" stroke="#7c8fff" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="270" y="465" width="166" height="30" rx="8" fill="#232342" stroke="#3d3d5c" stroke-width="1.3" />
    <text x="353" y="484" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8f5">/review-security</text>
  </g>

  <text x="620" y="400" font-size="10.5" fill="#a0a0c0">
    <tspan x="620" dy="0">Runs each phase in a</tspan>
    <tspan x="620" dy="14">fresh subagent, loops on</tspan>
    <tspan x="620" dy="14">any gap it finds, caps at</tspan>
    <tspan x="620" dy="14">5 iterations.</tspan>
  </text>

  <!-- Hand-off: /implement marks the spec done, then a manual step -->
  <line x1="440" y1="500" x2="440" y2="526" stroke="#5a5a7a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-dim)" />
  <text x="440" y="516" text-anchor="middle" font-size="9.5" fill="#7c8fff">manual hand-off - /implement never commits or pushes</text>

  <rect x="70" y="530" width="740" height="45" rx="10" fill="#232342" stroke="#3d3d5c" stroke-width="1.5" />
  <text x="90" y="558" font-size="13" font-weight="600" fill="#e8e8f5">/commit-and-push</text>
  <text x="300" y="558" font-size="10.5" fill="#a0a0c0">Pushes the branch, opens a PR or squash-merges per project-settings.md</text>
</svg>
